name: Homework 1 Auto-grading

on:
  push:
    paths:
      - "quality_scenarios.md"

jobs:
  autograde:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run auto-grader
        run: |
          python scripts/autograde_quality_scenarios.py
